name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install chromadb pypdf langchain-text-splitters numpy pandas requests reportlab pytest
      - run: pytest -q          # uses the offline hash embedder, no model download
