services:
  app:
    build: .
    ports: ["8501:8501"]
    environment:
      LLM_BACKEND: auto
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    volumes: ["./data:/app/data"]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama
    volumes: ["ollama:/root/.ollama"]
    ports: ["11434:11434"]
volumes:
  ollama:
